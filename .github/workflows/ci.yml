---
name: CI

"on":
  push:
    branches: ["main"]
  pull_request:

env:
  SECRETSPEC_PROVIDER: env

jobs:
  attestation:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.attest.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Determine whether to skip CI
        id: attest
        run: |
          scripts/ci-attestation-gate \
            --task check:all \
            --notes-ref refs/notes/nixos-setup-ci \
            --output-key skip

      - name: Skipped (local attestation)
        if: steps.attest.outputs.skip == 'true'
        run: |
          echo 'Skipping CI: local check:all attestation found.'

  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [attestation]
    if: needs.attestation.outputs.skip != 'true'
    environment: production
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}-devenv
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Install devenv.sh
        run: nix profile install nixpkgs#devenv

      - name: Run checks (devenv tasks)
        run: devenv tasks run -m all check:all
