---
name: CI

"on":
  push:
    branches: ["main"]
  pull_request:

permissions: read-all

env:
  SECRETSPEC_PROVIDER: env

jobs:
  attestation:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.attest.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine whether to skip CI
        id: attest
        run: |
          scripts/ci-attestation-gate \
            --task check:all \
            --notes-ref refs/notes/nixos-setup-ci \
            --output-key skip

      - name: Skipped (local attestation)
        if: steps.attest.outputs.skip == 'true'
        run: |
          echo 'Skipping CI: local check:all attestation found.'

  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [attestation]
    if: needs.attestation.outputs.skip != 'true'
    environment: production
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}-devenv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Install devenv.sh
        # Same CLI as local: pinned by flake.lock, not the runner registry.
        run: nix profile install .#devenv

      - name: Enable Cachix push for CI
        run: echo '{ cachix.push = "${{ env.CACHIX_CACHE }}"; }' > devenv.local.nix

      - name: Run checks (devenv tasks)
        run: devenv tasks run -m all check:all

  build-system:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [attestation]
    # Deliberately independent of the `ci` job: when that job breaks for a
    # toolchain reason (a devenv CLI/module mismatch, say), gating this one
    # on it turned the only NixOS evaluation in CI into a silent skip, and a
    # broken host config reached `rebuild` unnoticed.  Push-only because it
    # needs the Cachix push token.
    if: github.event_name == 'push' && !cancelled()
    environment: production
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/.ghcup /usr/local/lib/android \
            /usr/share/dotnet /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Evaluate every host configuration
        # base alone does not cover the real hosts: they import hardware,
        # bootloader and disk modules it never sees.  Eval is cheap next to
        # the closure build below, so run it first and name the host.
        run: |
          for host in base fw12 fw16; do
            echo "::group::nix eval $host"
            nix eval ".#nixosConfigurations.$host.config.system.build.toplevel" \
              --accept-flake-config
            echo "::endgroup::"
          done

      - name: Build system closure
        run: |
          nix build .#nixosConfigurations.base.config.system.build.toplevel \
            --print-build-logs \
            --accept-flake-config
