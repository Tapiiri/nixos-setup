---
name: CI

"on":
  push:
    branches: ["main"]
  pull_request:

permissions: read-all

env:
  SECRETSPEC_PROVIDER: env

jobs:
  attestation:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.attest.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine whether to skip CI
        id: attest
        run: |
          scripts/ci-attestation-gate \
            --task check:all \
            --notes-ref refs/notes/nixos-setup-ci \
            --output-key skip

      - name: Skipped (local attestation)
        if: steps.attest.outputs.skip == 'true'
        run: |
          echo 'Skipping CI: local check:all attestation found.'

  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [attestation]
    if: needs.attestation.outputs.skip != 'true'
    environment: production
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}-devenv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Install devenv.sh
        run: nix profile install nixpkgs#devenv

      - name: Enable Cachix push for CI
        run: echo '{ cachix.push = "${{ env.CACHIX_CACHE }}"; }' > devenv.local.nix

      - name: Run checks (devenv tasks)
        run: devenv tasks run -m all check:all

  build-system:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [ci]
    # Run when ci succeeds OR was skipped (attestation), but only on push.
    if: github.event_name == 'push' && !failure() && !cancelled()
    environment: production
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/.ghcup /usr/local/lib/android \
            /usr/share/dotnet /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Build system closure
        run: |
          nix build .#nixosConfigurations.base.config.system.build.toplevel \
            --print-build-logs \
            --accept-flake-config
