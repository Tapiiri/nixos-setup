name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-flake-lock:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@v16
        with:
          name: nixos-setup
          extraPullNames: nix-community

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            nix

      # Sanity-check the update using the same checks as CI.
      - name: Run checks (devenv tasks)
        run: nix run nixpkgs#devenv -- shell -- devenv tasks run check:all

  refresh-schemastore-cache:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@v16
        with:
          name: nixos-setup
          extraPullNames: nix-community

      - name: Refresh SchemaStore index + schemas
        run: |
          nix run nixpkgs#devenv -- shell -- \
          devenv tasks run sync:schemastore:index

      - name: Create PR (only if schemas/ changed)
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(schemastore): refresh schema cache"
          title: "chore(schemastore): refresh schema cache"
          body: |
            Automated refresh of the SchemaStore index and vendored schemas.
          branch: chore/refresh-schemastore-cache
          delete-branch: true
          add-paths: |
            schemas/
          labels: |
            dependencies
