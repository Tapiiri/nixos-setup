---
name: Update flake.lock

"on":
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: read

env:
  SECRETSPEC_PROVIDER: env

jobs:
  update-flake-lock:
    environment: production
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}-devenv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tapiiri-nixos-setup
          extraPullNames: nix-community

      - name: Discover remote inputs
        id: inputs
        run: |
          remote=$(python3 scripts/remote-flake-inputs)
          echo "names=$remote" >> "$GITHUB_OUTPUT"

      # Bump the devenv modules alongside the CLI that flake.lock pins, so the
      # two move together in one PR.  Committed here because the next step
      # opens the PR from HEAD (create-pull-request keeps local commits).
      - name: Update devenv.lock
        run: |
          nix run .#devenv -- update
          if ! git diff --quiet -- devenv.lock; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "devenv.lock: Update" -- devenv.lock
          fi

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          # Only update remote inputs; skip local path: inputs that don't exist on CI.
          inputs: ${{ steps.inputs.outputs.names }}
          pr-title: "chore: update flake.lock and devenv.lock"
          pr-labels: |
            dependencies
            nix

      # Sanity-check the update using the same checks as CI.
      - name: Run checks (devenv tasks)
        run: nix run .#devenv -- shell -- devenv tasks run -m all check:all

  # Pure data refresh with no review value, so it commits straight to main
  # rather than opening a PR.
  refresh-schemastore-cache:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    environment: production
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}-devenv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tapiiri-nixos-setup
          extraPullNames: nix-community

      - name: Refresh SchemaStore index + schemas
        run: |
          nix run .#devenv -- shell -- \
          devenv tasks run sync:schemastore:index

      # Run jq over every file in schemas/ so the committed files match what
      # the pre-commit jq-fmt hook would produce.
      - name: Format schemas with jq
        run: |
          find schemas/ -name "*.json" | while IFS= read -r f; do
            jq . "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Commit and push to main (only if schemas/ changed)
        run: |
          git add schemas/
          if git diff --cached --quiet; then
            echo "SchemaStore cache unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(schemastore): refresh schema cache"
          git pull --rebase origin main
          git push origin HEAD:main
