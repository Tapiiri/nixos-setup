---
name: Update flake.lock

"on":
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: read

env:
  SECRETSPEC_PROVIDER: env

jobs:
  update-flake-lock:
    environment: production
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}-devenv
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: tapiiri-nixos-setup
          extraPullNames: nix-community

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            nix

      # Sanity-check the update using the same checks as CI.
      - name: Run checks (devenv tasks)
        run: nix run nixpkgs#devenv -- shell -- devenv tasks run -m all check:all

  refresh-schemastore-cache:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    environment: production
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}-devenv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: tapiiri-nixos-setup
          extraPullNames: nix-community

      - name: Refresh SchemaStore index + schemas
        run: |
          nix run nixpkgs#devenv -- shell -- \
          devenv tasks run sync:schemastore:index

      # Run jq over every file in schemas/ so the pre-commit jq-fmt hook sees
      # nothing to reformat when create-pull-request makes its internal commit.
      - name: Format schemas with jq
        run: |
          find schemas/ -name "*.json" | while IFS= read -r f; do
            jq . "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Create PR (only if schemas/ changed)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore(schemastore): refresh schema cache"
          title: "chore(schemastore): refresh schema cache"
          body: |
            Automated refresh of the SchemaStore index and vendored schemas.
          branch: chore/refresh-schemastore-cache
          delete-branch: true
          add-paths: |
            schemas/
          labels: |
            dependencies
