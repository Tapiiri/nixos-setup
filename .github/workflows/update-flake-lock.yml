---
name: Update flake.lock

"on":
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: read

env:
  SECRETSPEC_PROVIDER: env

jobs:
  update-flake-lock:
    environment: production
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}-devenv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@f495f3ffa2f3810a92e5cc0abc2c5d6a2a07ec82 # v17
        with:
          name: tapiiri-nixos-setup
          extraPullNames: nix-community

      - name: Discover remote inputs
        id: inputs
        run: |
          remote=$(python3 scripts/remote-flake-inputs)
          echo "names=$remote" >> "$GITHUB_OUTPUT"

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          # Only update remote inputs; skip local path: inputs that don't exist on CI.
          inputs: ${{ steps.inputs.outputs.names }}
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            nix

      # Sanity-check the update using the same checks as CI.
      - name: Run checks (devenv tasks)
        run: nix run nixpkgs#devenv -- shell -- devenv tasks run -m all check:all

  refresh-schemastore-cache:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    environment: production
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}-devenv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@f495f3ffa2f3810a92e5cc0abc2c5d6a2a07ec82 # v17
        with:
          name: tapiiri-nixos-setup
          extraPullNames: nix-community

      - name: Refresh SchemaStore index + schemas
        run: |
          nix run nixpkgs#devenv -- shell -- \
          devenv tasks run sync:schemastore:index

      # Run jq over every file in schemas/ so the pre-commit jq-fmt hook sees
      # nothing to reformat when create-pull-request makes its internal commit.
      - name: Format schemas with jq
        run: |
          find schemas/ -name "*.json" | while IFS= read -r f; do
            jq . "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Create PR (only if schemas/ changed)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore(schemastore): refresh schema cache"
          title: "chore(schemastore): refresh schema cache"
          body: |
            Automated refresh of the SchemaStore index and vendored schemas.
          branch: chore/refresh-schemastore-cache
          delete-branch: true
          add-paths: |
            schemas/
          labels: |
            dependencies
