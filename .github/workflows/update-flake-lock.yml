---
name: Update flake.lock

"on":
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: read

env:
  SECRETSPEC_PROVIDER: env

jobs:
  update-flake-lock:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    env:
      SECRETSPEC_PROVIDER: env
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: tapiiri-nixos-setup
          extraPullNames: nix-community

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            nix

      # Sanity-check the update using the same checks as CI.
      - name: Run checks (devenv tasks)
        run: nix run nixpkgs#devenv -- shell -- devenv tasks run -m all check:all

  refresh-schemastore-cache:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use Cachix
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: tapiiri-nixos-setup
          extraPullNames: nix-community

      - name: Refresh SchemaStore index + schemas
        run: |
          nix run nixpkgs#devenv -- shell -- \
          devenv tasks run sync:schemastore:index

      - name: Create PR (only if schemas/ changed)
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          commit-message: "chore(schemastore): refresh schema cache"
          title: "chore(schemastore): refresh schema cache"
          body: |
            Automated refresh of the SchemaStore index and vendored schemas.
          branch: chore/refresh-schemastore-cache
          delete-branch: true
          add-paths: |
            schemas/
          labels: |
            dependencies
