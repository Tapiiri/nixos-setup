name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install devenv (via Nix)
        run: |
          set -euo pipefail
          nix profile install nixpkgs#devenv

      - name: Run checks (devenv tasks)
        run: devenv shell -- devenv tasks run check:all
