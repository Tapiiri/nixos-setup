[project]
name = "nixos-setup-scripts"
version = "0.1.0"
description = "Python reimplementations of nixos-setup maintenance scripts"
requires-python = ">=3.10"
dependencies = ["tomlkit>=0.11.6"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["scripts_py", "tests"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["scripts_py", "tests"]
